<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>LevelUp — Question Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #030712;
      color: #f8fafc;
    }

    .input-field {
      background-color: #111827;
      border: 1px solid #374151;
      color: #f8fafc;
      padding: 0.75rem;
      border-radius: 0.5rem;
      width: 100%;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: #22d3ee;
    }

    .label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #94a3b8;
      display: block;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card {
      background-color: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      padding: 2rem;
      backdrop-filter: blur(10px);
    }
  </style>
</head>

<body class="min-h-screen p-6 selection:bg-cyan-300 selection:text-black">
  <div class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-black tracking-tight text-white">Question <span class="text-cyan-300">Builder</span>
        </h1>
        <p class="text-sm text-gray-400 mt-1">Create and configure new challenges.</p>
      </div>
      <a href="/admin" class="flex items-center gap-2 text-sm font-bold text-gray-400 hover:text-white transition">
        <i data-lucide="arrow-left" class="size-4"></i> Back to Dashboard
      </a>
    </div>

    <div class="card shadow-2xl shadow-cyan-900/20">
      <form id="question-form" onsubmit="createQuestion(event)">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 pb-8 border-b border-white/10">
          <div>
            <label class="label">Question Index</label>
            <input name="index" type="number" required placeholder="1" class="input-field" />
          </div>
          <div>
            <label class="label">Topic</label>
            <input name="topic" required placeholder="History of Computing" class="input-field" />
          </div>
          <div>
            <label class="label">Question Type</label>
            <select name="qtype" id="qtype" onchange="toggleType()" class="input-field">
              <option value="mcq_single">Multiple Choice (Single Answer)</option>
              <option value="mcq_multi">Multiple Choice (Multi Answer)</option>
            </select>
          </div>
        </div>

        <div class="mb-8 pb-8 border-b border-white/10">
          <label class="label text-cyan-300">Main Prompt</label>
          <textarea name="prompt" rows="3" required placeholder="Enter the question text here..."
            class="input-field mb-4"></textarea>
        </div>

        <div id="mcq-section" class="mb-8 pb-8 border-b border-white/10">
          <div class="flex justify-between items-center mb-4">
            <label class="label text-fuchsia-300 mb-0">Answer Options</label>
            <button type="button" onclick="addOption()"
              class="flex items-center gap-2 text-xs font-bold text-fuchsia-300 bg-fuchsia-300/10 px-3 py-1.5 rounded-lg hover:bg-fuchsia-300/20 transition">
              <i data-lucide="plus" class="size-3"></i> Add Option
            </button>
          </div>

          <div id="options-container" class="space-y-4"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
          <div>
            <label class="label text-lime-300">Correct Answer Key</label>
            <input name="answer" required placeholder="Example: b, or 42, or Texas Instruments"
              class="input-field border-lime-300/30 focus:border-lime-300" />
            <p class="text-xs text-gray-500 mt-2">For MCQ, use option ids like a, b, c. For multi-answer MCQ, use
              comma-separated ids such as b, c.</p>
          </div>
          <div>
            <label class="label">Hint (Optional)</label>
            <input name="hint" placeholder="Provide a clue..." class="input-field" />
          </div>
        </div>

        <button type="submit"
          class="w-full flex items-center justify-center gap-2 bg-cyan-400 hover:bg-cyan-300 text-black font-black uppercase tracking-widest py-4 rounded-xl transition shadow-[0_0_20px_rgba(34,211,238,0.2)]">
          <i data-lucide="server" class="size-5"></i> Save Question to Database
        </button>
        <p id="status-msg" class="text-center mt-4 text-sm font-mono"></p>
      </form>
    </div>
  </div>

  <script src="/static/common.js"></script>
  <script>
    lucide.createIcons();

    const authState = auth();
    if (!authState || authState.role !== "admin") {
      window.location.href = "/";
    }

    let optionCount = 0;

    function toggleType() {
      const type = document.getElementById("qtype").value;
      const isMcq = type === "mcq_single" || type === "mcq_multi";
      document.getElementById("mcq-section").style.display = isMcq ? "block" : "none";
    }

    function addOption() {
      optionCount += 1;
      const id = `opt-${optionCount}`;
      const html = `
        <div id="${id}" class="flex gap-4 items-start bg-black/20 p-4 rounded-xl border border-white/5 relative group">
          <button type="button" onclick="document.getElementById('${id}').remove()" class="absolute -right-2 -top-2 bg-red-500 text-white p-1 rounded-full opacity-0 group-hover:opacity-100 transition">
            <i data-lucide="x" class="size-3"></i>
          </button>
          <div class="w-20">
            <label class="label text-[10px] mb-2">ID</label>
            <input type="text" class="opt-id input-field text-sm" value="${String.fromCharCode(97 + (optionCount - 1))}" />
          </div>
          <div class="flex-1">
            <label class="label text-[10px] mb-2">Text</label>
            <input type="text" class="opt-text input-field text-sm" placeholder="Option text" required />
          </div>
        </div>
      `;
      document.getElementById("options-container").insertAdjacentHTML("beforeend", html);
      lucide.createIcons();
    }

    addOption();
    addOption();
    toggleType();

    async function createQuestion(event) {
      event.preventDefault();

      const status = document.getElementById("status-msg");
      status.textContent = "Processing...";
      status.className = "text-center mt-4 text-sm font-mono text-cyan-300 animate-pulse";

      const fd = new FormData(event.target);
      const qtype = String(fd.get("qtype") || "mcq_single");
      const topic = String(fd.get("topic") || "").trim();
      const prompt = String(fd.get("prompt") || "").trim();
      const answerRaw = String(fd.get("answer") || "").trim();
      const hint = String(fd.get("hint") || "").trim();

      let options = null;
      let answerKey = {};

      if (qtype === "mcq_single" || qtype === "mcq_multi") {
        const rows = [...document.querySelectorAll("#options-container > div")];
        options = rows.map((row) => {
          const id = (row.querySelector(".opt-id")?.value || "").trim() || "a";
          const text = (row.querySelector(".opt-text")?.value || "").trim();
          return { id: id.toLowerCase(), text };
        }).filter((opt) => opt.text);

        if (!options.length) {
          status.textContent = "Add at least one option.";
          status.className = "text-center mt-4 text-sm font-mono text-red-500";
          return;
        }

        if (qtype === "mcq_single") {
          answerKey = { option_id: answerRaw.toLowerCase() };
        } else {
          answerKey = {
            option_ids: answerRaw.split(",").map((x) => x.trim().toLowerCase()).filter(Boolean),
          };
        }
      } else {
        status.textContent = "Unsupported question type: only MCQ is allowed.";
        status.className = "text-center mt-4 text-sm font-mono text-red-500";
        return;
      }

      const payload = {
        index: Number(fd.get("index")),
        topic,
        prompt,
        qtype,
        options,
        answer_key: answerKey,
        hint: hint || null,
      };

      try {
        await api("/api/v1/admin/questions", {
          method: "POST",
          body: JSON.stringify(payload),
        });

        status.textContent = "SUCCESS: Question saved to the database.";
        status.className = "text-center mt-4 text-sm font-mono text-lime-400";
        event.target.reset();
        optionCount = 0;
        document.getElementById("options-container").innerHTML = "";
        addOption();
        addOption();
        toggleType();
      } catch (err) {
        status.textContent = "ERROR: " + err.message;
        status.className = "text-center mt-4 text-sm font-mono text-red-500";
      }
    }
  </script>
</body>

</html>
