<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Level Up — Admin</title>
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    /* A few inline tweaks to keep your original CSS readable on a wider dashboard */
    .admin-container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .section { border: 1px solid #444; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    input, textarea, select { width: 100%; margin-bottom: 10px; padding: 5px; }
  </style>
</head>
<body>
  <main class="admin-container box">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1>Event Control Panel</h1>
      <button onclick="logout()">Log Out</button>
    </div>
    
    <p id="err" class="err" style="color: red; font-weight: bold;"></p>

    <div class="section">
      <h2>Phase Control: <span id="phase">LOADING...</span></h2>
      <select id="qselect"></select>
      <div style="margin-top: 10px; display: flex; gap: 10px;">
        <button id="showTopic">1. Show Topic</button>
        <button id="startQ">2. Start Question</button>
        <button id="closeQ">3. Close Question</button>
      </div>
    </div>

    <div class="grid-2">
      <div class="section">
        <h2>Live Leaderboard</h2>
        <ul id="board"></ul>
      </div>

      <div class="section">
        <h2>Add Team</h2>
        <form id="teamForm">
          <label>Display Name <input name="name" required /></label>
          <label>Login Username <input name="username" required /></label>
          <label>Password <input name="password" required /></label>
          <label>Starting Score (Optional) <input name="score" type="number" /></label>
          <button type="submit">Create Team</button>
        </form>
      </div>
    </div>

    <div class="section">
      <h2>Add New Question</h2>
      <form id="qForm">
        <div class="grid-2">
          <label>Question Index <input name="index" type="number" required /></label>
          <label>Topic <input name="topic" required /></label>
        </div>
        <label>Question Type <input name="qtype" value="mcq" required /></label>
        <label>Question Prompt <textarea name="prompt" rows="3" required></textarea></label>
        
        <hr style="margin: 15px 0; border-color: #444;">
        <h3>Options (Text & Image URLs)</h3>
        <div class="grid-2">
          <div>
            <label>Option A (Text) <input name="optA_text" required /></label>
            <label>Option A (Image URL) <input name="optA_img" /></label>
          </div>
          <div>
            <label>Option B (Text) <input name="optB_text" required /></label>
            <label>Option B (Image URL) <input name="optB_img" /></label>
          </div>
          <div>
            <label>Option C (Text) <input name="optC_text" required /></label>
            <label>Option C (Image URL) <input name="optC_img" /></label>
          </div>
          <div>
            <label>Option D (Text) <input name="optD_text" required /></label>
            <label>Option D (Image URL) <input name="optD_img" /></label>
          </div>
        </div>

        <hr style="margin: 15px 0; border-color: #444;">
        <div class="grid-2">
          <label>Correct Answer Key
            <select name="answer_key" required>
              <option value="" disabled selected>Select Answer...</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
            </select>
          </label>
          <label>Hint (Optional) <input name="hint" /></label>
        </div>
        
        <button type="submit" style="margin-top: 15px;">Save Question to Database</button>
      </form>
    </div>

    <div class="section">
      <h2>System Diagnostics</h2>
      <pre id="matrix" style="font-size: 10px; overflow-x: auto;"></pre>
      <pre id="audit" style="font-size: 10px; overflow-x: auto;"></pre>
    </div>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/admin.js"></script>
</body>
</html>
