<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin Dashboard — Live Game Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; padding: 1.5rem; }
    input { background-color: #0f172a; border: 1px solid #334155; color: white; padding: 0.5rem; border-radius: 0.375rem; width: 100%; margin-top: 0.25rem; }
    input:focus { outline: none; border-color: #38bdf8; }
    label { font-size: 0.875rem; font-weight: 600; color: #94a3b8; display: block; margin-top: 0.75rem; }
    /* Custom Scrollbar for the panels */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="p-6 selection:bg-cyan-300 selection:text-black">
  <div class="max-w-7xl mx-auto">
    
    <!-- Header -->
    <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
      <div>
        <h1 class="text-3xl font-black tracking-tight text-white">Live <span class="text-cyan-400">Dashboard</span></h1>
        <p class="text-sm text-gray-400 mt-1">Event control and phase synchronization.</p>
      </div>
      <div class="flex gap-4">
        <a href="/add_question.html" target="_blank" class="flex items-center gap-2 bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-bold py-2 px-4 rounded-lg transition">
          <i data-lucide="layout-grid" class="size-4"></i> Question Builder
        </a>
        <button onclick="logout()" class="flex items-center gap-2 bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded-lg transition">
          <i data-lucide="log-out" class="size-4"></i> Log Out
        </button>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- LEFT COLUMN: Controls & Teams -->
      <div class="flex flex-col gap-6 lg:col-span-1">
        
        <!-- Phase Control -->
        <div class="card shadow-xl shadow-black/40">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold text-white">Phase Control</h2>
            <span id="current-phase" class="font-mono text-xs uppercase tracking-widest text-cyan-400 font-bold bg-cyan-400/10 px-3 py-1 rounded-full border border-cyan-400/20">LOADING...</span>
          </div>
          
          <div class="grid grid-cols-2 gap-3 mb-6">
            <button id="btn-idle" onclick="setPhase('idle')" class="phase-btn bg-gray-700 hover:bg-gray-600 text-white py-2 rounded-lg font-bold uppercase tracking-wider text-sm transition border-2 border-transparent">Idle</button>
            <button id="btn-topic" onclick="setPhase('topic')" class="phase-btn bg-purple-900 hover:bg-purple-700 text-white py-2 rounded-lg font-bold uppercase tracking-wider text-sm transition border-2 border-transparent">Topic</button>
            <button id="btn-live" onclick="setPhase('live')" class="phase-btn bg-lime-900 hover:bg-lime-700 text-white py-2 rounded-lg font-bold uppercase tracking-wider text-sm transition border-2 border-transparent">Live</button>
            <button id="btn-closed" onclick="setPhase('closed')" class="phase-btn bg-red-900 hover:bg-red-700 text-white py-2 rounded-lg font-bold uppercase tracking-wider text-sm transition border-2 border-transparent">Closed</button>
          </div>

          <div class="border-t border-white/10 pt-4">
            <button onclick="nextQuestion()" class="w-full flex items-center justify-center gap-2 bg-cyan-500 hover:bg-cyan-400 text-black font-black uppercase tracking-widest py-3 rounded-xl transition shadow-[0_0_15px_rgba(6,182,212,0.3)]">
              Advance Sequence <i data-lucide="arrow-right-circle" class="size-5"></i>
            </button>
            <p id="active-question-id" class="text-center text-xs text-gray-500 mt-2 font-mono">Active Q: None</p>
          </div>
        </div>

        <!-- Add Team -->
        <div class="card shadow-xl shadow-black/40">
          <h2 class="text-lg font-bold text-white mb-2 flex items-center gap-2"><i data-lucide="users" class="size-4 text-fuchsia-400"></i> Register Team</h2>
          <form id="team-form" onsubmit="createTeam(event)">
            <div class="grid grid-cols-2 gap-2">
              <div><label class="text-xs">Display Name</label><input name="name" required class="text-sm" /></div>
              <div><label class="text-xs">Username</label><input name="username" required class="text-sm" /></div>
              <div><label class="text-xs">Password</label><input name="password" type="password" required class="text-sm" /></div>
              <div><label class="text-xs">Score</label><input name="score" type="number" value="0" class="text-sm" /></div>
            </div>
            <button type="submit" class="mt-4 w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 rounded-lg transition text-sm">Create Team</button>
          </form>
          <p id="team-status" class="mt-2 text-center text-xs font-mono"></p>
        </div>
      </div>

      <!-- MIDDLE COLUMN: Question Manager -->
      <div class="card shadow-xl shadow-black/40 lg:col-span-1 flex flex-col h-[80vh]">
        <div class="flex items-center justify-between mb-4 border-b border-white/10 pb-4">
          <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <i data-lucide="database" class="size-5 text-cyan-400"></i> Database Queue
          </h2>
          <button onclick="fetchQuestions()" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1 rounded transition">Refresh</button>
        </div>
        
        <!-- Scrollable Question List -->
        <div id="questions-container" class="flex-1 overflow-y-auto space-y-4 pr-2">
          <p class="text-gray-500 text-sm text-center mt-10 animate-pulse">Loading questions...</p>
          <!-- Injected via JS -->
        </div>
      </div>

      <!-- RIGHT COLUMN: Leaderboard -->
      <div class="card shadow-xl shadow-black/40 lg:col-span-1 flex flex-col h-[80vh]">
        <div class="flex items-center justify-between mb-4 border-b border-white/10 pb-4">
          <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <i data-lucide="trophy" class="size-5 text-lime-400"></i> Live Standings (16 Max)
          </h2>
          <button onclick="fetchLeaderboard()" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1 rounded transition">Refresh</button>
        </div>
        
        <!-- Scrollable Leaderboard List -->
        <div class="flex-1 overflow-y-auto pr-2">
          <table class="w-full text-left text-sm">
            <thead class="text-xs uppercase text-gray-500 sticky top-0 bg-[#1e293b] pb-2">
              <tr>
                <th class="py-2">Rank</th>
                <th class="py-2">Team Name</th>
                <th class="py-2 text-right">Score</th>
              </tr>
            </thead>
            <tbody id="leaderboard-container" class="divide-y divide-white/5">
              <!-- Injected via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="/static/common.js"></script>
  <script>
    lucide.createIcons();
    const a = auth();
    if (!a || a.role !== 'admin') window.location.href = "/";

    // ON LOAD: Fetch all data
    window.onload = async () => {
      await fetchGameState();
      await fetchQuestions();
      await fetchLeaderboard();
    };

    // --- 1. STATE MANAGEMENT ---
    async function fetchGameState() {
      try {
        const res = await api("/api/v1/admin/state");
        const state = await res.json();
        updatePhaseUI(state.phase);
        document.getElementById('active-question-id').innerText = state.current_question_id ? `Active Q: ${state.current_question_id.substring(0,8)}...` : "Active Q: None";
      } catch (err) {
        console.error("Failed to fetch state:", err);
      }
    }

    async function setPhase(newPhase) {
      try {
        await api("/api/v1/admin/state", { method: "POST", body: JSON.stringify({ phase: newPhase }) });
        updatePhaseUI(newPhase);
      } catch (err) { alert("Error: " + err.message); }
    }

    function updatePhaseUI(phase) {
      document.getElementById('current-phase').innerText = "STATUS: " + phase;
      document.querySelectorAll('.phase-btn').forEach(btn => {
        btn.classList.remove('border-white', 'opacity-100');
        btn.classList.add('opacity-50', 'border-transparent');
      });
      const activeBtn = document.getElementById(`btn-${phase}`);
      if (activeBtn) activeBtn.classList.remove('opacity-50', 'border-transparent');
      if (activeBtn) activeBtn.classList.add('border-white', 'opacity-100');
    }

    async function nextQuestion() {
      if(!confirm("Advance to the next question?")) return;
      try {
        await api("/api/v1/admin/next-question", { method: "POST" });
        await fetchGameState(); // Refresh state immediately
      } catch (err) { alert("Error: " + err.message); }
    }

    // --- 2. QUESTION MANAGER ---
    async function fetchQuestions() {
      const container = document.getElementById('questions-container');
      try {
        const res = await api("/api/v1/admin/questions"); // Assumes GET route exists
        const questions = await res.json();
        
        if (questions.length === 0) {
          container.innerHTML = `<p class="text-gray-500 text-sm text-center">No questions found. Use the Question Builder.</p>`;
          return;
        }

        container.innerHTML = questions.sort((a,b) => a.index - b.index).map(q => `
          <div class="bg-black/20 border border-white/5 p-4 rounded-xl">
            <div class="flex justify-between items-start mb-2">
              <span class="font-mono text-xs font-bold text-cyan-400 bg-cyan-400/10 px-2 py-1 rounded">Q${q.index} | ${q.topic}</span>
              <span class="text-[10px] text-gray-500 uppercase tracking-wider">${q.qtype}</span>
            </div>
            <p class="text-sm text-white font-medium mb-3">${q.prompt}</p>
            <div class="space-y-1">
              <p class="text-xs"><span class="text-gray-500">Answer:</span> <span class="text-lime-400 font-mono">${q.answer_key.exact}</span></p>
              ${q.hint ? `<p class="text-xs"><span class="text-gray-500">Hint:</span> <span class="text-fuchsia-300 italic">${q.hint}</span></p>` : ''}
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p class="text-red-400 text-xs p-4">Error fetching questions. Ensure backend GET route exists. (${err.message})</p>`;
      }
    }

    // --- 3. LEADERBOARD ---
    async function fetchLeaderboard() {
      const container = document.getElementById('leaderboard-container');
      try {
        const res = await api("/api/v1/admin/teams"); // Assumes GET route returns teams
        const teams = await res.json();
        
        container.innerHTML = teams.sort((a,b) => b.score - a.score).map((team, index) => `
          <tr class="hover:bg-white/5 transition">
            <td class="py-3 font-mono text-xs text-gray-400">#${index + 1}</td>
            <td class="py-3 font-bold text-white">${team.name}</td>
            <td class="py-3 text-right font-mono text-lime-400">${team.score.toLocaleString()}</td>
          </tr>
        `).join('');
      } catch (err) {
        container.innerHTML = `<tr><td colspan="3" class="text-red-400 text-xs py-4">Error loading teams.</td></tr>`;
      }
    }

    // --- 4. TEAMS ---
    async function createTeam(e) {
      e.preventDefault();
      const status = document.getElementById('team-status');
      const fd = new FormData(e.target);
      try {
        await api("/api/v1/admin/teams", {
          method: "POST",
          body: JSON.stringify({
            name: fd.get("name"),
            username: fd.get("username"),
            password: fd.get("password"),
            score: parseInt(fd.get("score") || 0)
          })
        });
        status.innerText = "Team added!";
        status.className = "mt-2 text-center text-xs font-mono text-green-400";
        e.target.reset();
        await fetchLeaderboard(); // Auto-refresh leaderboard
      } catch (err) {
        status.innerText = err.message;
        status.className = "mt-2 text-center text-xs font-mono text-red-400";
      }
    }

    function logout() { clearAuth(); window.location.href = "/"; }
  </script>
</body>
</html>
