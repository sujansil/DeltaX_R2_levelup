<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Player Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #111; color: #eee; }
        #status { font-weight: bold; padding: 10px; border: 1px solid #444; }
    </style>
</head>
<body>
    <h1>Player Dashboard</h1>
    <div id="status">Status: Waiting for token...</div>
    <p id="player-info" style="color: #888;"></p>
    
    <hr style="border-color: #333; margin: 20px 0;">
    
    <h3>Live Server Messages:</h3>
    <pre id="messages" style="background: #000; padding: 10px; border: 1px solid #333; min-height: 100px;"></pre>

    <!-- Import your secure API and WebSocket wrappers -->
    <script src="/static/common.js"></script>
    <script>
        // 1. Call the secure auth() function directly from common.js
        const a = auth();
        const statusEl = document.getElementById("status");

        if (!a || !a.access_token) {
            statusEl.innerText = "Status: BLOCKED. No login token found.";
            statusEl.style.color = "red";
        } else {
            statusEl.innerText = "Status: Token found. Connecting...";
            statusEl.style.color = "orange";
            
            // Display the user securely parsed from the login data
            document.getElementById("player-info").innerText = "Logged in as: " + (a.team_name || a.username);

            // 2. Use your existing WebSocket connector from common.js
            const ws = connectWs((data) => {
                const msgBox = document.getElementById("messages");
                msgBox.innerText = "Received update:\n" + JSON.stringify(data, null, 2) + "\n\n" + msgBox.innerText;
            });

            if (ws) {
                ws.onopen = () => {
                    statusEl.innerText = "Status: CONNECTED TO SERVER!";
                    statusEl.style.color = "#4ade80"; // Bright green
                };
                ws.onclose = () => {
                    statusEl.innerText = "Status: DISCONNECTED.";
                    statusEl.style.color = "red";
                };
            }
        }
    </script>
</body>
</html>
